services:
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    ports:
      - "9092:9092"       # client connections from the host (producer.py, Spark)
      - "9093:9093"       # internal broker/controller listener
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Single-broker local dev cluster ID -- any fixed valid value works here,
      # this one was generated once with `kafka-storage.sh random-uuid`.
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 5

  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists
       --topic raw_trades --partitions 3 --replication-factor 1"

  grafana:
    image: grafana/grafana:11.3.0
    container_name: grafana
    ports:
      - "3000:3000"       # dashboard UI at http://localhost:3000
    environment:
      GF_INSTALL_PLUGINS: grafana-athena-datasource
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Read-only Athena credentials for a dedicated IAM user (see
      # grafana/iam/grafana-athena-reader-policy.json) -- deliberately NOT the
      # Spark job's read/write keys. Values come from the project's .env file.
      GRAFANA_AWS_ACCESS_KEY_ID: ${GRAFANA_AWS_ACCESS_KEY_ID}
      GRAFANA_AWS_SECRET_ACCESS_KEY: ${GRAFANA_AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-us-east-2}
      ATHENA_OUTPUT_LOCATION: ${ATHENA_OUTPUT_LOCATION}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro   # data source + dashboard loader
      - ./grafana/dashboards:/etc/grafana/dashboards:ro       # dashboard JSON, version-controlled
      - grafana_data:/var/lib/grafana                         # plugins, users, UI state

volumes:
  kafka_data:
  grafana_data: